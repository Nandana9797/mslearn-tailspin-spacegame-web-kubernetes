trigger:
- main

variables:
  buildConfiguration: 'Release'
  leaderboardRepository: 'leaderboard'
  webRepository: 'web'
  tag: '$(Build.BuildId)'

stages:

# ============================================================
# BUILD
# ============================================================

- stage: Build
  displayName: Build the containers

  variables:
  - group: Release

  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: 'ubuntu-latest'

    steps:

    # --------------------------------------------------------
    # Login to Azure Container Registry
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: Login to Azure Container Registry
      inputs:
        azureSubscription: 'Kubernetes Cluster Connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name tailspinspacegame123

    # --------------------------------------------------------
    # Build and push Web image
    # --------------------------------------------------------

    - script: |
        docker build \
          -t $(RegistryName)/$(webRepository):$(tag) \
          -f $(Build.SourcesDirectory)/Tailspin.SpaceGame.Web/Dockerfile \
          $(Build.Repository.LocalPath)

        docker push $(RegistryName)/$(webRepository):$(tag)
      displayName: Build and push web image

    # --------------------------------------------------------
    # Build and push Leaderboard image
    # --------------------------------------------------------

    - script: |
        echo "=============================================="
        echo "CREATING .NET 8 LEADERBOARD DOCKERFILE"
        echo "=============================================="

        cat > "$(Build.SourcesDirectory)/Leaderboard.Dockerfile" <<'EOF'
        FROM mcr.microsoft.com/dotnet/aspnet:8.0 AS base
        WORKDIR /app
        EXPOSE 80

        FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
        WORKDIR /src

        COPY ["Tailspin.SpaceGame.LeaderboardContainer/Tailspin.SpaceGame.LeaderboardContainer.csproj", "Tailspin.SpaceGame.LeaderboardContainer/"]

        RUN dotnet --version

        RUN dotnet restore "Tailspin.SpaceGame.LeaderboardContainer/Tailspin.SpaceGame.LeaderboardContainer.csproj"

        COPY . .
        WORKDIR "/src/Tailspin.SpaceGame.LeaderboardContainer"

        RUN dotnet build "Tailspin.SpaceGame.LeaderboardContainer.csproj" -c Release -o /app/build

        FROM build AS publish
        RUN dotnet publish "Tailspin.SpaceGame.LeaderboardContainer.csproj" -c Release -o /app/publish

        FROM base AS final
        WORKDIR /app
        COPY --from=publish /app/publish .

        ENTRYPOINT ["dotnet", "Tailspin.SpaceGame.LeaderboardContainer.dll"]
        EOF

        echo "=============================================="
        echo "LEADERBOARD DOCKERFILE CREATED BY PIPELINE"
        echo "=============================================="

        cat "$(Build.SourcesDirectory)/Leaderboard.Dockerfile"

        echo "=============================================="
        echo "BUILDING LEADERBOARD USING .NET 8"
        echo "=============================================="

        docker pull mcr.microsoft.com/dotnet/sdk:8.0
        docker pull mcr.microsoft.com/dotnet/aspnet:8.0

        docker build \
          --pull \
          --no-cache \
          -t $(RegistryName)/$(leaderboardRepository):$(tag) \
          -f "$(Build.SourcesDirectory)/Leaderboard.Dockerfile" \
          "$(Build.Repository.LocalPath)"

        echo "=============================================="
        echo "PUSHING LEADERBOARD IMAGE"
        echo "=============================================="

        docker push $(RegistryName)/$(leaderboardRepository):$(tag)

      displayName: Build and push leaderboard image

    # --------------------------------------------------------
    # Publish Kubernetes manifests
    # --------------------------------------------------------

    - publish: '$(Build.SourcesDirectory)/manifests'
      artifact: manifests


# ============================================================
# DEPLOY
# ============================================================

- stage: Deploy
  displayName: Deploy the containers

  dependsOn: Build

  jobs:
  - deployment: Deploy
    displayName: Deploy

    pool:
      vmImage: 'ubuntu-latest'

    environment: 'Tailspin-Space-Game'

    variables:
    - group: Release

    strategy:
      runOnce:
        deploy:

          steps:

          # --------------------------------------------------
          # Download manifests
          # --------------------------------------------------

          - download: current
            artifact: manifests

          # --------------------------------------------------
          # Deploy to AKS
          # --------------------------------------------------

          - task: KubernetesManifest@1
            displayName: Deploy to Kubernetes cluster
            inputs:
              action: deploy
              connectionType: azureResourceManager

              azureSubscriptionConnection: 'Kubernetes Cluster Connection'

              azureResourceGroup: 'tailspin-space-game-rg'

              kubernetesCluster: 'tailspinspacegame-29481'

              namespace: 'default'

              manifests: |
                $(Pipeline.Workspace)/manifests/deployment.yml
                $(Pipeline.Workspace)/manifests/service.yml

              containers: |
                $(RegistryName)/$(webRepository):$(tag)
                $(RegistryName)/$(leaderboardRepository):$(tag)